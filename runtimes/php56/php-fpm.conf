[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
