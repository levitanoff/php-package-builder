; Legacy templates use short tags. Application-specific encoding belongs in
; an additional project INI file, after verifying both public pages and admin.
short_open_tag = On
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.upload_progress.enabled = Off
memory_limit = 128M
post_max_size = 32M
upload_max_filesize = 24M
cgi.fix_pathinfo = 0
